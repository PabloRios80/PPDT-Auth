<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consulta de Afiliado — IAPOS</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        body { font-family: 'Montserrat', sans-serif; }
        .semaforo-rojo { background:#fee2e2; border-left:4px solid #dc2626; color:#991b1b; }
        .semaforo-amarillo { background:#fef3c7; border-left:4px solid #d97706; color:#92400e; }
        .semaforo-verde { background:#dcfce7; border-left:4px solid #16a34a; color:#166534; }
        .semaforo-gris { background:#f9fafb; border-left:4px solid #9ca3af; color:#374151; }
    </style>
    <script>
    (function() {
        const params = new URLSearchParams(window.location.search);
        const tokenUrl = params.get('token');
        if (tokenUrl) {
            localStorage.setItem('dpToken', tokenUrl);
            window.history.replaceState({}, '', window.location.pathname);
        }
        const token = localStorage.getItem('dpToken');
        if (!token) {
            window.location.href = '/login.html';
            return;
        }
        try {
            const payload = JSON.parse(atob(token.split('.')[1]));
            const ahora = Math.floor(Date.now() / 1000);
            if (payload.exp && payload.exp < ahora) {
                localStorage.removeItem('dpToken');
                window.location.href = '/login.html';
                return;
            }
            window.dpPayload = payload;
        } catch(e) {
            window.location.href = '/login.html';
        }
    })();
    </script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- HEADER -->
    <header style="background-color:#014189; padding:0; margin:0;">
        <div style="background-color:#014189; padding:12px 20px; display:flex; align-items:center; justify-content:space-between; max-width:1080px; margin:0 auto;">
            <div style="display:flex; align-items:center; gap:16px;">
                <img src="images/logo_iapos.png" alt="Logo IAPOS" style="height:50px;" />
                <div>
                    <div style="font-size:16px; font-weight:700; color:#fff;">Consulta de Afiliado</div>
                    <div style="font-size:11px; color:#00a8e7; font-weight:600; text-transform:uppercase; letter-spacing:0.1em;">Día Preventivo IAPOS</div>
                </div>
            </div>
            <div style="display:flex; align-items:center; gap:12px;">
                <span id="nombreUsuario" style="color:#00a8e7; font-size:13px; font-weight:600;"></span>
                <a href="/portal-pv.html" style="background:#3b82f6; color:white; border:none; border-radius:6px; padding:6px 14px; font-size:12px; font-weight:700; text-decoration:none;">
                    ← Portal
                </a>
            </div>
        </div>
        <div style="background-color:#00a8e7; height:4px;"></div>
    </header>

    <main class="flex-grow" style="max-width:900px; margin:0 auto; width:100%; padding:24px 16px;">

        <!-- BÚSQUEDA -->
        <div class="bg-white rounded-xl shadow p-5 mb-5 border border-blue-100">
            <h2 class="font-bold text-blue-800 mb-3 flex items-center">
                <i class="fas fa-search text-blue-500 mr-2"></i> Buscar Afiliado
            </h2>
            <div class="flex gap-2">
                <input type="text" id="dniInput" placeholder="Ingresá el DNI del afiliado..." maxlength="9"
                    class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" />
                <button onclick="buscarAfiliado()"
                    class="bg-blue-600 text-white px-5 py-2 rounded-lg text-sm font-bold hover:bg-blue-700">
                    <i class="fas fa-search mr-1"></i> Buscar
                </button>
            </div>
        </div>

        <!-- LOADING -->
        <div id="loading" class="hidden text-center py-8 text-gray-400">
            <i class="fas fa-spinner fa-spin text-3xl mb-2"></i>
            <p>Cargando historial del afiliado...</p>
        </div>

        <!-- RESULTADO -->
        <div id="resultado" class="hidden space-y-4">

            <!-- Tarjeta afiliado -->
            <div id="tarjetaAfiliado" class="bg-white rounded-xl shadow p-5 border border-blue-100"></div>

            <!-- Hoja de Vida -->
            <div id="tarjetaHojaDeVida" class="hidden bg-white rounded-xl shadow p-5 border border-blue-100"></div>

            <!-- Último DP -->
            <div id="tarjetaUltimoDP" class="hidden bg-white rounded-xl shadow p-5 border border-blue-100"></div>

            <!-- Prácticas pendientes -->
            <div id="tarjetaPendientes" class="hidden bg-white rounded-xl shadow p-5 border border-yellow-100"></div>

            <!-- Estudios realizados -->
            <div id="tarjetaEstudios" class="hidden bg-white rounded-xl shadow p-5 border border-green-100"></div>

            <!-- Turnos externos -->
            <div id="tarjetaTurnos" class="hidden bg-white rounded-xl shadow p-5 border border-gray-200"></div>

            <!-- Derivaciones -->
            <div id="tarjetaDerivaciones" class="hidden bg-white rounded-xl shadow p-5 border border-purple-100"></div>

        </div>

    </main>

    <footer class="text-center text-sm text-gray-500 py-4">
        <p>&copy; 2025 IAPOS. Programa Día Preventivo de la Salud.</p>
    </footer>

<script>
document.addEventListener('DOMContentLoaded', () => {
    if (window.dpPayload) {
        document.getElementById('nombreUsuario').textContent =
            `${window.dpPayload.nombre || ''} ${window.dpPayload.apellido || ''}`.trim();
    }
    document.getElementById('dniInput').addEventListener('keypress', e => {
        if (e.key === 'Enter') buscarAfiliado();
    });

    // Si viene con ?dni= en la URL, buscar automáticamente
    const params = new URLSearchParams(window.location.search);
    const dniParam = params.get('dni');
    if (dniParam) {
        document.getElementById('dniInput').value = dniParam;
        buscarAfiliado();
    }
});

async function buscarAfiliado() {
    const dni = document.getElementById('dniInput').value.trim();
    if (!dni) return alert('Ingresá un DNI.');

    const dniNorm = dni.replace(/^[a-zA-Z]+/, '').trim();
    const token = localStorage.getItem('dpToken');

    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('resultado').classList.add('hidden');

    try {
        // 1. Verificar en IAPOS
        const [iaposRes, estudiosRes, pendientesRes, turnosRes, derivacionesRes, ultimoDPRes, hojaDeVidaRes] = await Promise.all([
            fetch(`/verificar-afiliado/${dni}`),
            fetch('/api/estudios-paciente', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ dni: dniNorm })
            }),
            fetch(`/api/practicas-pendientes/${dniNorm}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            }),
            fetch(`/api/turnos-externos-afiliado/${dniNorm}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            }),
            fetch(`/api/derivaciones-afiliado/${dniNorm}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            }),
            fetch(`/api/ultimo-dp/${dniNorm}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            }),
            fetch(`/api/hoja-de-vida/${dniNorm}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            })
        ]);

        const iapos = await iaposRes.json();
        const estudios = await estudiosRes.json();
        const pendientes = await pendientesRes.json();
        const turnos = await turnosRes.json();
        const derivaciones = await derivacionesRes.json();
        const ultimoDP = await ultimoDPRes.json();
        const hojaDeVida = await hojaDeVidaRes.json();

        document.getElementById('loading').classList.add('hidden');
        document.getElementById('resultado').classList.remove('hidden');

        renderTarjetaAfiliado(iapos, dni);
        renderHojaDeVida(hojaDeVida);
        renderUltimoDP(ultimoDP);
        renderPendientes(pendientes);
        renderEstudios(estudios);
        renderTurnos(turnos);
        renderDerivaciones(derivaciones);

    } catch(e) {
        document.getElementById('loading').classList.add('hidden');
        alert('Error al buscar el afiliado. Intentá de nuevo.');
        console.error(e);
    }
}

function renderTarjetaAfiliado(iapos, dni) {
    const el = document.getElementById('tarjetaAfiliado');
    if (iapos.esActivo) {
        el.innerHTML = `
            <div class="flex justify-between items-start">
                <div>
                    <p class="text-xl font-bold text-gray-800">${iapos.nombre || 'Sin nombre'}</p>
                    <p class="text-sm text-gray-500 mt-1">DNI: ${dni} | ${iapos.edad || '?'} años | Sexo: ${iapos.sexo === '2' ? 'Femenino' : 'Masculino'}</p>
                    <p class="text-sm text-gray-500">${iapos.localidad || ''}</p>
                </div>
                <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm font-bold">✅ Afiliado activo</span>
            </div>`;
    } else {
        el.innerHTML = `
            <div class="flex justify-between items-start">
                <p class="font-bold text-gray-800">DNI: ${dni}</p>
                <span class="bg-red-100 text-red-700 px-3 py-1 rounded-full text-sm font-bold">❌ No activo en IAPOS</span>
            </div>
            <p class="text-sm text-red-600 mt-1">${iapos.mensaje || ''}</p>`;
    }
}

function etiquetaSiNo(valor) {
    if (valor === 'si') return { texto: 'Sí', clase: 'bg-red-50 text-red-700' };
    if (valor === 'no') return { texto: 'No', clase: 'bg-gray-50 text-gray-400' };
    if (valor === 'no_sabe') return { texto: 'No sabe', clase: 'bg-yellow-50 text-yellow-700' };
    if (valor === 'No aplica') return { texto: 'No aplica', clase: 'bg-gray-50 text-gray-400' };
    return { texto: 'Sin dato', clase: 'bg-gray-50 text-gray-300' };
}

function etiquetaFuma(valor) {
    const mapa = {
        nunca: { texto: 'Nunca fumó', clase: 'bg-gray-50 text-gray-400' },
        ex_fumador: { texto: 'Ex fumador', clase: 'bg-yellow-50 text-yellow-700' },
        menos_de_10: { texto: 'Sí, <10/día', clase: 'bg-red-50 text-red-700' },
        entre_10_y_20: { texto: 'Sí, 10-20/día', clase: 'bg-red-50 text-red-700' },
        mas_de_20: { texto: 'Sí, +20/día', clase: 'bg-red-50 text-red-700' },
    };
    return mapa[valor] || { texto: 'Sin dato', clase: 'bg-gray-50 text-gray-300' };
}

function renderHojaDeVida(data) {
    const el = document.getElementById('tarjetaHojaDeVida');
    const hv = data.hojaDeVida;

    if (!hv) {
        el.innerHTML = `
            <h3 class="font-bold text-gray-700 mb-2"><i class="fas fa-file-medical text-red-400 mr-2"></i>Hoja de Vida</h3>
            <p class="text-red-600 text-sm font-bold">❌ No completó la Hoja de Vida.</p>`;
        el.classList.remove('hidden');
        return;
    }

    const fecha = hv.fecha_carga
        ? new Date(hv.fecha_carga).toLocaleDateString('es-AR', {year:'numeric', month:'long', day:'numeric'})
        : '';

    const factores = [
        ['Hipertensión', etiquetaSiNo(hv.hipertension)],
        ['Diabetes', etiquetaSiNo(hv.diabetes)],
        ['Colesterol', etiquetaSiNo(hv.colesterol)],
        ['Depresión', etiquetaSiNo(hv.depresion)],
        ['Sedentarismo', etiquetaSiNo(hv.sedentarismo)],
        ['Abuso alcohol/drogas', etiquetaSiNo(hv.abuso_alcohol_drogas)],
        ['Estrés', etiquetaSiNo(hv.stress)],
        ['Exceso preocupación por la salud', etiquetaSiNo(hv.exceso_preocupacion_salud)],
        ['Exceso de pantalla', etiquetaSiNo(hv.exceso_pantalla)],
        ['Fuma', etiquetaFuma(hv.fuma)],
        ['Fumador crónico', etiquetaSiNo(hv.fumador_cronico)],
        ['Hipertensión familiar', etiquetaSiNo(hv.hipertension_familiar)],
        ['Diabetes familiar', etiquetaSiNo(hv.diabetes_familiar)],
        ['Adicciones familiar', etiquetaSiNo(hv.adicciones_familiar)],
        ['Obesidad familiar', etiquetaSiNo(hv.obesidad_familiar)],
        ['Depresión familiar', etiquetaSiNo(hv.depresion_familiar)],
        ['Violencia familiar', etiquetaSiNo(hv.violencia_familiar)],
        ['Antecedente cáncer de colon', etiquetaSiNo(hv.cancer_de_colon)],
        ['Antecedente cáncer de mama', etiquetaSiNo(hv.cancer_de_mama)],
        ['Antecedente cáncer cuello uterino', etiquetaSiNo(hv.cancer_cuello_utero)],
        ['Antecedente cáncer de próstata', etiquetaSiNo(hv.cancer_de_prostata)],
    ];

    el.innerHTML = `
        <div class="flex justify-between items-start mb-2">
            <h3 class="font-bold text-gray-700"><i class="fas fa-file-medical text-green-500 mr-2"></i>Hoja de Vida</h3>
            <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold">✅ Completada</span>
        </div>
        <p class="text-sm text-gray-500 mb-3">Cargada el ${fecha}${hv.origen_carga ? ' · Origen: ' + hv.origen_carga : ''}</p>
        <button onclick="document.getElementById('detalleHojaVida').classList.toggle('hidden'); this.querySelector('i').classList.toggle('fa-chevron-down'); this.querySelector('i').classList.toggle('fa-chevron-up');"
            class="text-blue-600 text-sm font-bold mb-2">
            <i class="fas fa-chevron-down mr-1"></i>Ver resultados
        </button>
        <div id="detalleHojaVida" class="hidden">
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 mb-3">
                <div class="bg-gray-50 rounded-lg p-2 text-xs text-gray-600">Altura: <strong>${hv.altura ?? '-'}</strong></div>
                <div class="bg-gray-50 rounded-lg p-2 text-xs text-gray-600">Peso: <strong>${hv.peso ?? '-'}</strong></div>
                <div class="bg-gray-50 rounded-lg p-2 text-xs text-gray-600">BMI: <strong>${hv.bmi ?? '-'} (${hv.categoria_bmi ?? '-'})</strong></div>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                ${factores.map(([label, tag]) => `
                    <div class="flex justify-between items-center rounded-lg p-2 text-xs ${tag.clase}">
                        <span>${label}</span><span class="font-bold ml-2">${tag.texto}</span>
                    </div>`).join('')}
            </div>
        </div>`;
    el.classList.remove('hidden');
}

function renderUltimoDP(data) {
    const el = document.getElementById('tarjetaUltimoDP');
    if (!data.success || !data.ultimoDP) {
        el.innerHTML = `
            <h3 class="font-bold text-gray-700 mb-2"><i class="fas fa-calendar-check text-blue-500 mr-2"></i>Último Día Preventivo</h3>
            <p class="text-gray-400 text-sm">Sin Día Preventivo previo registrado.</p>`;
        el.classList.remove('hidden');
        return;
    }
    const dp = data.ultimoDP;
    const dias = Math.floor((new Date() - new Date(dp.fechax)) / (1000 * 60 * 60 * 24));
    el.innerHTML = `
        <h3 class="font-bold text-gray-700 mb-3"><i class="fas fa-calendar-check text-blue-500 mr-2"></i>Último Día Preventivo</h3>
        <div class="bg-blue-50 rounded-lg p-3">
            <p class="font-bold text-blue-800">${new Date(dp.fechax).toLocaleDateString('es-AR', {year:'numeric', month:'long', day:'numeric'})}</p>
            <p class="text-sm text-blue-600">${dp.efector || ''} — hace ${dias} días</p>
        </div>`;
    el.classList.remove('hidden');
}

function renderPendientes(data) {
    const el = document.getElementById('tarjetaPendientes');
    const practicas = data.practicas || [];
    if (practicas.length === 0) {
        el.classList.add('hidden');
        return;
    }
    el.innerHTML = `
        <h3 class="font-bold text-yellow-700 mb-3"><i class="fas fa-clock text-yellow-500 mr-2"></i>Prácticas Pendientes (${practicas.length})</h3>
        <div class="space-y-2">
            ${practicas.map(p => `
                <div class="flex justify-between items-center bg-yellow-50 rounded-lg p-3">
                    <div>
                        <p class="font-bold text-gray-800 text-sm">${p.descripcion_practica}</p>
                        <p class="text-xs text-gray-500">Cód: ${p.codigo_prestacion || 'S/C'}</p>
                    </div>
                    <span class="bg-yellow-100 text-yellow-700 text-xs px-2 py-1 rounded-full font-bold">PENDIENTE</span>
                </div>`).join('')}
        </div>`;
    el.classList.remove('hidden');
}

function renderEstudios(data) {
    const el = document.getElementById('tarjetaEstudios');
    const estudios = data.estudios || [];
    if (estudios.length === 0) {
        el.classList.add('hidden');
        return;
    }

    const ORDEN = ['Laboratorio', 'Enfermeria', 'Odontologia', 'Mamografia', 'Eco mamaria', 'VCC', 'Densitometria', 'Papanicolau', 'Espirometria', 'Ecografia', 'Oftalmologia', 'Biopsia'];
    const agrupados = {};
    estudios.forEach(e => {
        const tipo = e.TipoEstudio || 'Otro';
        if (!agrupados[tipo]) agrupados[tipo] = [];
        agrupados[tipo].push(e);
    });

    const tiposOrdenados = [...new Set([...ORDEN, ...Object.keys(agrupados)])].filter(t => agrupados[t]);

    let html = `<h3 class="font-bold text-green-700 mb-3"><i class="fas fa-check-circle text-green-500 mr-2"></i>Estudios Realizados</h3>`;

    tiposOrdenados.forEach(tipo => {
        const lista = agrupados[tipo];
        html += `
            <details class="mb-3">
                <summary class="cursor-pointer bg-green-50 rounded-lg px-4 py-2 font-bold text-green-800 text-sm hover:bg-green-100">
                    ${tipo} (${lista.length})
                </summary>
                <div class="mt-2 space-y-2 pl-2">`;

        lista.forEach(e => {
            html += `<div class="bg-gray-50 rounded-lg p-3 text-sm border border-gray-200">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="font-bold text-gray-700">${e.Prestador || 'S/P'}</p>
                        <p class="text-xs text-gray-400">${e.Fecha || 'S/F'}</p>
                    </div>
                    ${e.LinkPDF ? `<a href="${e.LinkPDF}" target="_blank" class="bg-red-100 text-red-700 text-xs px-2 py-1 rounded font-bold hover:bg-red-200"><i class="fas fa-file-pdf mr-1"></i>PDF</a>` : ''}
                </div>`;

            if (e.ResultadosLaboratorio) {
                const vals = Object.entries(e.ResultadosLaboratorio).filter(([k,v]) => v);
                if (vals.length > 0) {
                    html += `<div class="mt-2 grid grid-cols-2 gap-1">`;
                    vals.forEach(([k, v]) => {
                        const semaforo = evaluarSemaforoSimple(k, v);
                        html += `<div class="rounded px-2 py-1 text-xs ${semaforo}">
                            <span class="font-bold">${k.replace(/_/g,' ')}:</span> ${v}
                        </div>`;
                    });
                    html += `</div>`;
                }
            } else if (e.ResultadosEnfermeria) {
                const vals = Object.entries(e.ResultadosEnfermeria).filter(([k,v]) => v && k !== 'Espirometria_PDF');
                if (vals.length > 0) {
                    html += `<div class="mt-2 grid grid-cols-2 gap-1">`;
                    vals.forEach(([k, v]) => {
                        html += `<div class="rounded px-2 py-1 text-xs bg-blue-50 text-blue-700">
                            <span class="font-bold">${k.replace(/_/g,' ')}:</span> ${v}
                        </div>`;
                    });
                    html += `</div>`;
                }
            } else if (e.Resultado) {
                html += `<p class="text-xs text-gray-600 mt-1"><span class="font-bold">Resultado:</span> ${e.Resultado}</p>`;
            }

            html += `</div>`;
        });

        html += `</div></details>`;
    });

    el.innerHTML = html;
    el.classList.remove('hidden');
}

function renderTurnos(data) {
    const el = document.getElementById('tarjetaTurnos');
    const turnos = data.turnos || [];
    if (turnos.length === 0) {
        el.classList.add('hidden');
        return;
    }
    el.innerHTML = `
        <h3 class="font-bold text-gray-700 mb-3"><i class="fas fa-calendar-alt text-gray-500 mr-2"></i>Turnos Externos Agendados</h3>
        <div class="space-y-2">
            ${turnos.map(t => `
                <div class="flex justify-between items-center bg-gray-50 rounded-lg p-3">
                    <div>
                        <p class="font-bold text-gray-800 text-sm">${t.practica}</p>
                        <p class="text-xs text-gray-500">${t.nombre_prestador || 'S/P'} — ${t.fecha_turno || 'S/F'} ${t.hora_turno || ''}</p>
                    </div>
                    <span class="text-xs px-2 py-1 rounded-full font-bold ${t.estado === 'PENDIENTE' ? 'bg-yellow-100 text-yellow-700' : 'bg-green-100 text-green-700'}">${t.estado}</span>
                </div>`).join('')}
        </div>`;
    el.classList.remove('hidden');
}

function renderDerivaciones(data) {
    const el = document.getElementById('tarjetaDerivaciones');
    const derivaciones = data.derivaciones || [];
    const activas = derivaciones.filter(d => d.estado !== 'CONCURRIÓ');
    if (activas.length === 0) {
        el.classList.add('hidden');
        return;
    }
    el.innerHTML = `
        <h3 class="font-bold text-purple-700 mb-3"><i class="fas fa-hospital text-purple-500 mr-2"></i>Derivaciones Activas (${activas.length})</h3>
        <div class="space-y-2">
            ${activas.map(d => `
                <div class="bg-purple-50 rounded-lg p-3">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="font-bold text-gray-800 text-sm">${d.especialidad}</p>
                            <p class="text-xs text-gray-500">${d.motivo || ''}</p>
                            <p class="text-xs text-gray-400">Seguimiento: ${d.fecha_seguimiento || 'S/F'}</p>
                        </div>
                        <span class="text-xs px-2 py-1 rounded-full font-bold bg-purple-100 text-purple-700">${d.estado}</span>
                    </div>
                </div>`).join('')}
        </div>`;
    el.classList.remove('hidden');
}

function evaluarSemaforoSimple(campo, valor) {
    const v = (valor || '').toString().toUpperCase();
    if (['POSITIVO','REACTIVO','DETECTABLE'].some(x => v.includes(x))) return 'semaforo-rojo';
    if (['NEGATIVO','NO REACTIVO','NO DETECTABLE','NORMAL'].some(x => v.includes(x))) return 'semaforo-verde';
    return 'semaforo-gris';
}
